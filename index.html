<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Многофункциональный таймер, секундомер, Pomodoro и интервальный тренер." />
  <title>Ultimate Timer</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <div class="header">
      <div>
        <p class="eyebrow">Фокус • тренировки • учёба</p>
        <h1 id="app-title">⏱️ Ultimate Timer</h1>
      </div>
      <div class="row mode-tabs" role="tablist" aria-label="Режим таймера">
        <button class="pill active" data-mode="countdown" role="tab" aria-selected="true" aria-controls="timerPanel">Таймер</button>
        <button class="pill" data-mode="stopwatch" role="tab" aria-selected="false" aria-controls="timerPanel">Секундомер</button>
        <button class="pill" data-mode="pomodoro" role="tab" aria-selected="false" aria-controls="timerPanel">Pomodoro</button>
        <button class="pill" data-mode="interval" role="tab" aria-selected="false" aria-controls="timerPanel">Интервалы</button>
        <button class="pill" id="themeBtn" type="button" aria-pressed="false">🌓 Тема</button>
      </div>
    </div>

    <section class="timer" id="timerPanel">
      <div class="face">
        <button class="pill focus-toggle" id="focusBtn" type="button">⛶ Фокус-режим</button>
        <div class="ring-wrap" aria-label="Прогресс">
          <svg viewBox="0 0 220 220" aria-hidden="true">
            <circle cx="110" cy="110" r="94" fill="none" stroke="rgba(148,163,184,.25)" stroke-width="14"/>
            <circle id="progress" cx="110" cy="110" r="94" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round" transform="rotate(-90 110 110)"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs>
          </svg>
          <div class="time" id="display" role="timer" aria-live="polite">25:00</div>
        </div>
        <div class="phase-card" id="phaseCard">Готов к запуску</div>
        <div class="cycle-progress" id="cycleProgress" aria-live="polite"></div>
      </div>

      <aside class="panel" aria-label="Настройки и управление">
        <div class="inputs mode-panel" data-panel="countdown pomodoro">
          <div>
            <label for="minutes">Минуты</label>
            <input id="minutes" type="number" min="0" max="600" value="25" inputmode="numeric" />
          </div>
          <div>
            <label for="seconds">Секунды</label>
            <input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric" />
          </div>
        </div>

        <details class="settings-card mode-panel" data-panel="pomodoro">
          <summary>Настройки Pomodoro</summary>
          <div class="inputs compact">
            <div><label for="shortBreakMinutes">Короткий перерыв, мин</label><input id="shortBreakMinutes" type="number" min="1" max="120" value="5" inputmode="numeric" /></div>
            <div><label for="longBreakMinutes">Длинный перерыв, мин</label><input id="longBreakMinutes" type="number" min="1" max="240" value="15" inputmode="numeric" /></div>
            <div><label for="sessionsBeforeLongBreak">Фокусов до длинного</label><input id="sessionsBeforeLongBreak" type="number" min="1" max="12" value="4" inputmode="numeric" /></div>
            <label class="check-row"><input type="checkbox" id="autoStartPomodoro" /> Автостарт следующей фазы</label>
          </div>
        </details>

        <div class="inputs mode-panel hidden" data-panel="interval">
          <div><label for="warmupSeconds">Разминка, сек</label><input id="warmupSeconds" type="number" min="0" max="3600" value="0" inputmode="numeric" /></div>
          <div><label for="workSeconds">Работа, сек</label><input id="workSeconds" type="number" min="1" max="3600" value="40" inputmode="numeric" /></div>
          <div><label for="restSeconds">Отдых, сек</label><input id="restSeconds" type="number" min="0" max="3600" value="20" inputmode="numeric" /></div>
          <div><label for="cooldownSeconds">Заминка, сек</label><input id="cooldownSeconds" type="number" min="0" max="3600" value="0" inputmode="numeric" /></div>
          <div><label for="rounds">Раунды</label><input id="rounds" type="number" min="1" max="99" value="8" inputmode="numeric" /></div>
          <label class="check-row"><input type="checkbox" id="autoStartInterval" checked /> Автопродолжение фаз</label>
        </div>

        <div class="controls">
          <button class="btn primary" id="startBtn" type="button">Старт</button>
          <button class="btn warn" id="pauseBtn" type="button" disabled>Пауза</button>
          <button class="btn danger" id="resetBtn" type="button">Сброс</button>
          <button class="btn success" id="lapBtn" type="button">Круг</button>
        </div>

        <div class="presets" aria-label="Быстрые пресеты">
          <button class="pill" data-preset="300" type="button">5 мин</button>
          <button class="pill" data-preset="900" type="button">15 мин</button>
          <button class="pill" data-preset="1500" type="button">Pomodoro 25</button>
          <button class="pill" data-preset="3000" type="button">Фокус 50</button>
        </div>

        <form class="custom-preset" id="presetForm">
          <label for="presetName">Свой пресет</label>
          <div class="row no-wrap">
            <input id="presetName" type="text" placeholder="Название" maxlength="20" />
            <input id="presetMinutes" type="number" min="0" max="600" placeholder="Мин" inputmode="numeric" />
            <input id="presetSeconds" type="number" min="0" max="59" placeholder="Сек" inputmode="numeric" />
            <button class="btn secondary" type="submit">Добавить</button>
          </div>
        </form>
        <div class="presets custom-list" id="customPresets" aria-label="Пользовательские пресеты"></div>

        <details class="settings-card" open>
          <summary>Звук и поведение</summary>
          <div class="extra">
            <label><input type="checkbox" id="sound" checked /> Звук</label>
            <label for="soundType">Сигнал</label>
            <select id="soundType"><option value="classic">Классика</option><option value="soft">Мягкий</option><option value="alert">Будильник</option></select>
            <label><input type="checkbox" id="voice" /> Голосовые подсказки</label>
            <label><input type="checkbox" id="wakeLock" /> Не гасить экран</label>
            <label for="volume">Громкость</label>
            <input id="volume" type="range" min="0" max="1" step="0.05" value="0.25" />
            <button class="pill" id="testSoundBtn" type="button">▶ Проверить</button>
            <button class="pill" id="notifyBtn" type="button">🔔 Уведомления</button>
          </div>
        </details>

        <div class="shortcuts" aria-label="Горячие клавиши">
          <kbd>Space</kbd> старт/пауза · <kbd>R</kbd> сброс · <kbd>L</kbd> круг · <kbd>T</kbd> тема · <kbd>F</kbd> фокус · <kbd>1–4</kbd> пресеты
        </div>

        <span class="stat" id="status" aria-live="polite">Режим: Таймер</span>
        <div class="laps" id="laps" aria-label="История кругов"></div>
        <div class="stats" id="stats" aria-label="Статистика"></div>
        <div class="history-toolbar">
          <button class="pill" id="exportBtn" type="button">Экспорт JSON</button>
          <button class="pill" id="clearHistoryBtn" type="button">Очистить историю</button>
        </div>
        <div class="history" id="history" aria-label="История сессий"></div>
      </aside>
    </section>
  </main>

  <div class="update-toast hidden" id="updateToast" role="status">
    Доступна новая версия.
    <button class="pill" id="reloadBtn" type="button">Обновить</button>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
